<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Race Registration!!</h1>
    <br>
    <form action="/Treino_HTML/pages/utils/SuccessForm.html">

        <label for="firstName">First Name:</label>
        <input type="text" placeholder="First Name" id="firstName" required>
        <label for="lastName">Last Name:</label>
        <input type="text" placeholder="Last Name" id="lastName" required>

        <br>

        <h3>Select a Race:</h3>
        <div>
            <input id="funRun" type="radio" value="FunRun5K">
            <label for="funrun">Fun Run'5K</label>
        </div>
        <div>
            <input id="halfMarathon" type="radio" value="HalfMarathon">
            <label for="halfMarathon">Half Marathon</label>
        </div>
        <div>
            <input id="fullMarathon" type="radio" value="FullMarathon">
            <label for="fullMarathon">Full Marathon</label>
        </div>

        <br>

        <label for="email">Email:</label>
        <input type="email" placeholder="Insira Email" id="email" required>
        <label for="password">Password:</label>
        <input type="password" placeholder="Insira Password" id="password" required>

        <br>
        <br>

        <label for="age_choice">Select Age Group</label>
        <select name="idade" id="age_choice">
            <option value="over18">Over 18</option>
            <option value="under18">Under 18</option>
            <option value="under16">Under 16</option>
            <option value="under12">Under 12</option>
        </select>

        <br>
        <br>

        <button type="submit">Submeter Formulario</button>

    </form>

</body>

</html>
